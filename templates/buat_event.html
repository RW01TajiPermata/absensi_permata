{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4 class="text-center">Buat Event Baru</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="nama_event" class="form-label">Nama Event</label>
                        <input type="text" class="form-control" id="nama_event" name="nama_event" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="deskripsi" class="form-label">Deskripsi Event</label>
                        <textarea class="form-control" id="deskripsi" name="deskripsi" rows="3" required></textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="tanggal_event" class="form-label">Tanggal Event</label>
                            <div class="input-group event-picker-group">
                                <input type="date" class="form-control" id="tanggal_event" name="tanggal_event" required>
                                <button class="btn date-picker-trigger" type="button" data-picker="tanggal_event" aria-label="Pilih tanggal event"><i class="fas fa-calendar-days"></i></button>
                            </div>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="waktu_event" class="form-label">Waktu Event</label>
                            <div class="input-group event-picker-group">
                                <input type="time" class="form-control" id="waktu_event" name="waktu_event" required>
                                <button class="btn date-picker-trigger" type="button" data-picker="waktu_event" aria-label="Pilih waktu event"><i class="fas fa-clock"></i></button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="lokasi" class="form-label">Lokasi</label>
                        <input type="text" class="form-control" id="lokasi" name="lokasi" required>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Buat Event</button>
                        <a href="{{ url_for('admin_events') }}" class="btn btn-outline-secondary">Kembali</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
document.querySelectorAll('.date-picker-trigger').forEach(function (button) {
    button.addEventListener('click', function () {
        const input = document.getElementById(button.dataset.picker);
        if (!input) return;
        try {
            input.showPicker();
        } catch (error) {
            input.focus();
        }
    });
});
</script>
{% endblock %}
